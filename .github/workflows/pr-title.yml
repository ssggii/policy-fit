name: pr-title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits (optional Jira key)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $TITLE"
          if echo "$TITLE" | grep -Eq '^([A-Z][A-Z0-9]+-[0-9]+ )?(feat|fix|docs|chore|refactor|test|build|ci|perf)(\([a-z0-9-]+\))?!?: .+'; then
            echo "OK"
          else
            echo "::error::PR 제목 형식 오류. 예) feat(backend): ...  또는  YP-42 feat(backend): ..."
            exit 1
          fi

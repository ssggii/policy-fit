name: pr-automation
on:
  pull_request:
    types: [opened, reopened, edited]
permissions:
  contents: read
  pull-requests: write
jobs:
  automate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: assign author (ssggii)
        run: gh pr edit "$PR" -R "$REPO" --add-assignee ssggii || true
      - name: label by conventional-commit type
        run: |
          type=$(printf '%s' "$TITLE" | sed -nE 's/^([A-Z][A-Z0-9]+-[0-9]+ )?(feat|fix|docs|chore|refactor|test|build|ci|perf)(\(.+\))?!?:.*/\2/p')
          if [ -n "$type" ]; then
            gh pr edit "$PR" -R "$REPO" --add-label "$type" && echo "labeled: $type"
          else
            echo "제목에서 Conventional Commits 타입을 찾지 못함 — 라벨 생략"
          fi

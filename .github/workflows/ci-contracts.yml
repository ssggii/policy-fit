name: ci-contracts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['contracts/**', 'contract-tests/**', 'DOMAIN.md', '.github/workflows/ci-contracts.yml']
  pull_request:
    paths: ['contracts/**', 'contract-tests/**', 'DOMAIN.md', '.github/workflows/ci-contracts.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - run: python contract-tests/validate.py
